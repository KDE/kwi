include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/reuse-lint.yml
      - /gitlab-templates/clang-format.yml
      - /gitlab-templates/commit-checks.yml
      - /gitlab-templates/cppcheck.yml
      - /gitlab-templates/linux-qt6.yml
      - /gitlab-templates/linux-qt6-next.yml
      - /gitlab-templates/freebsd-qt6.yml
      - /gitlab-templates/flatpak.yml

.suse_tumbleweed_qt6stable:
  before_script:
    - !reference [.ci_linux_base, before_script]

    - !reference [.kwi_ghostty, before_script]

.suse_tumbleweed_qt6next:
  before_script: !reference [.suse_tumbleweed_qt6stable, before_script]

freebsd150_qt611:
  before_script:
    - git clone https://invent.kde.org/sysadmin/ci-utilities.git --depth=1
    - git clone https://invent.kde.org/sysadmin/repo-metadata.git ci-utilities/repo-metadata/ --depth=1

    - !reference [.kwi_ghostty, before_script]

.kwi_ghostty:
  before_script:
    - export Ghostty_ROOT="$HOME/devel/install/kwi-ci-ghostty"

    - |
      python3 - <<'PY'
      import hashlib
      import json
      import os
      from pathlib import Path
      import platform
      import shlex
      import shutil
      import subprocess
      import tempfile
      import urllib.parse

      # Share the manifest's reviewed source, compiler and package pins.
      manifest = json.loads(Path(".flatpak-manifest.json").read_text())
      module = next(module for module in manifest["modules"] if module["name"] == "libghostty-vt")
      freebsd = platform.system() == "FreeBSD"

      # The Flatpak manifest only contains Linux pins.
      if freebsd:
          module["sources"] = [source for source in module["sources"] if source.get("dest") != "zig"]
          module["sources"].append({
              "type": "archive",
              "url": "https://ziglang.org/download/0.17.0/zig-x86_64-freebsd-0.17.0.tar.xz",
              "sha256": "a314f1cc92d098bd39caf9e5607a0de2a8fd0d00064776cb3fd5b3bee38a67c9",
              "dest": "zig",
          })

      prefix = Path(os.environ["Ghostty_ROOT"])
      build = Path.home() / "devel/build"
      build.mkdir(parents=True, exist_ok=True)
      prefix.mkdir(parents=True, exist_ok=True)

      with tempfile.TemporaryDirectory(prefix="kwi-ghostty-", dir=build) as temporary:
          work = Path(temporary)
          source_dir = work / "source"
          source_dir.mkdir()

          for source in module["sources"]:
              if platform.machine() not in source.get("only-arches", [platform.machine()]):
                  continue

              if source["type"] not in ("archive", "file"):
                  raise RuntimeError(f"Unsupported Ghostty source type: {source['type']}")

              print(f"Fetching {source['url']}", flush=True)
              download = work / "download"
              subprocess.run(["curl", "--fail", "--location", "--silent", "--show-error", "--output", str(download), source["url"]], check=True)

              with download.open("rb") as downloaded:
                  if hashlib.file_digest(downloaded, "sha256").hexdigest() != source["sha256"]:
                      raise RuntimeError(f"Checksum mismatch: {source['url']}")

              destination = source_dir / source.get("dest", ".")
              destination.mkdir(parents=True, exist_ok=True)

              if source["type"] == "archive":
                  subprocess.run(["tar", "-xf", str(download), "--strip-components=1", "-C", str(destination)], check=True)
              else:
                  shutil.copyfile(download, destination / Path(urllib.parse.urlparse(source["url"]).path).name)

          for command in module["build-commands"]:
              if freebsd and command.startswith("install "):
                  command = "ginstall " + command.removeprefix("install ")

              subprocess.run(command.replace("/app", shlex.quote(str(prefix))), shell=True, cwd=source_dir, check=True)
      PY

    - export LD_LIBRARY_PATH="$Ghostty_ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
