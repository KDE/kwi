<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <description>Accept fixed-width bitmap fonts</description>
    <selectfont>
        <acceptfont>
            <pattern>
                <patelt name="outline"><bool>false</bool></patelt>
                <patelt name="spacing"><const>mono</const></patelt>
            </pattern>
            <pattern>
                <patelt name="outline"><bool>false</bool></patelt>
                <patelt name="spacing"><const>charcell</const></patelt>
            </pattern>
        </acceptfont>
    </selectfont>
</fontconfig>
