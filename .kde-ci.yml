Dependencies:
  - 'on': ['Linux', 'FreeBSD']
    'require':
      'frameworks/extra-cmake-modules': '@latest-kf6'
      'frameworks/kcoreaddons': '@latest-kf6'
      'frameworks/kconfig': '@latest-kf6'
      'frameworks/kdbusaddons': '@latest-kf6'
      'frameworks/kguiaddons': '@latest-kf6'
      'frameworks/ki18n': '@latest-kf6'
      'frameworks/kirigami': '@latest-kf6'
      'frameworks/kpty': '@latest-kf6'
      'frameworks/kio': '@latest-kf6'
      'frameworks/knotifications': '@latest-kf6'
      'frameworks/kwindowsystem': '@latest-kf6'
      'frameworks/kparts': '@latest-kf6'
      'frameworks/kxmlgui': '@latest-kf6'
      'frameworks/kwidgetsaddons': '@latest-kf6'
      'frameworks/kitemmodels': '@latest-kf6'
      'frameworks/qqc2-desktop-style': '@latest-kf6'
      'libraries/kirigami-addons': '@latest-kf6'
      'libraries/kirigami-app-components': '@latest-kf6'

Options:
  clang-format-versions: [19]
  commit-checks: ['bug-links']
  cppcheck-arguments:
    - --enable=warning,style,performance
    # Preserve Qt-style value getters, including implicitly shared values.
    - --suppress=returnByReference
    # Q_MOC_INCLUDE is moc-only. Ghostty's emit member is not a Qt keyword.
    - '-DQ_MOC_INCLUDE(x)='
    - -Uemit
